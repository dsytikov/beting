<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Прогнозы на футбол — сегодня</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <header class="app-header">
        <h1>⚽ Прогнозы на футбольные матчи</h1>
        <p class="subtitle" id="current-date"></p>
        <div class="status-bar">
            <span id="status-bsd" class="status-badge">BSD: ожидание…</span>
            <span id="status-sstats" class="status-badge">SStats: ожидание…</span>
            <button id="refresh-btn" class="refresh-btn">Обновить</button>
        </div>
    </header>

    <main>
        <div id="loading" class="loading hidden">
            <div class="spinner"></div>
            <p>Загрузка прогнозов…</p>
        </div>

        <div id="error-container" class="error-container hidden">
            <p id="error-message"></p>
        </div>

        <div class="table-wrapper">
            <table id="predictions-table">
                <thead>
                    <tr>
                        <th data-sort="time">Время</th>
                        <th data-sort="league">Лига</th>
                        <th data-sort="home">Хозяева</th>
                        <th data-sort="away">Гости</th>
                        <th>Исход</th>
                        <th data-sort="probabilityOutcome">Вер. исхода</th>
                        <th>ТБ (голы)</th>
                        <th>ТМ (голы)</th>
                        <th>Тотал (инд.)</th>
                        <th>Угловые</th>
                        <th>Жёлтые</th>
                        <th>Источник</th>
                    </tr>
                </thead>
                <tbody id="table-body">
                    <!-- Строки добавляются динамически -->
                </tbody>
            </table>
        </div>

        <p id="empty-state" class="empty-state hidden">На сегодня прогнозов не найдено.</p>
    </main>

    <footer>
        <p>Данные предоставлены <a href="https://sports.bzzoiro.com" target="_blank">Bzzoiro Sports Data</a> и <a href="https://sstats.net" target="_blank">SStats.net</a></p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
