name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject API tokens into app.js
        env:
          BSD_TOKEN: ${{ secrets.BSD_TOKEN }}
          SSTATS_TOKEN: ${{ secrets.SSTATS_TOKEN }}
        run: |
          # Заменяем плейсхолдеры на реальные токены из GitHub Secrets
          sed -i "s|__BSD_TOKEN__|${BSD_TOKEN}|g" app.js
          sed -i "s|__SSTATS_TOKEN__|${SSTATS_TOKEN}|g" app.js

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
